; supervisord config for Hermes Cloud Desktop
[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
nodaemon=false

[program:hermes-poller]
command=/home/vscode/hermes/.venv/bin/python /home/vscode/hermes/poller.py
user=vscode
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/poller.log
stderr_logfile=/var/log/supervisor/poller.err
environment=
    HOME="/home/vscode",
    PATH="/home/vscode/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
    PYTHONUNBUFFERED="1"
